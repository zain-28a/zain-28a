  <rect x="0.75" y="0.75" width="493.5" height="228.5" rx="17.25" fill="#161821" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <path d="M18 2.35 H477" stroke="#FFFFFF" stroke-opacity="0.22" stroke-linecap="round"/>
  <circle cx="29" cy="32" r="4" fill="#8B5CF6"/>
