<svg xmlns="http://www.w3.org/2000/svg" width="495" height="230" viewBox="0 0 495 230" role="img" aria-labelledby="title">
  <title id="title">Most Used Languages</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#272738"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 700; fill: #ECECF4; letter-spacing: 0.4px; }
    .k { font-size: 12px; font-weight: 600; fill: #9A9AB0; letter-spacing: 0.6px; }
    .v { font-size: 26px; font-weight: 700; fill: #ECECF4; }
    .s { font-size: 12.5px; fill: #9A9AB0; }
    .l { font-size: 13px; font-weight: 600; fill: #ECECF4; }
    
  </style>
  <rect x="0.75" y="0.75" width="493.5" height="228.5" rx="16" fill="#0B0B12" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="24" y="24" width="4" height="16" rx="2" fill="url(#accent)"/>
  <text class="t h" x="38" y="37">Most Used Languages</text>
  <clipPath id="round"><rect x="24" y="58" width="447" height="10" rx="5"/></clipPath>
  <g clip-path="url(#round)">
    <rect x="24" y="58" width="447" height="10" fill="#1D1D2B"/>
    <rect x="24.00" y="58" width="323.40" height="10" fill="#8B5CF6"/>
    <rect x="349.40" y="58" width="55.70" height="10" fill="#6D7CF5"/>
    <rect x="407.09" y="58" width="46.01" height="10" fill="#3B82F6"/>
    <rect x="455.10" y="58" width="6.59" height="10" fill="#38BDF8"/>
    <rect x="463.69" y="58" width="4.88" height="10" fill="#A78BFA"/>
    <rect x="470.57" y="58" width="0.00" height="10" fill="#64748B"/>
  </g>
  <g class="t">
    <circle cx="30" cy="98" r="5" fill="#8B5CF6"/>
    <text class="l" x="44" y="102">Dart</text>
    <text class="s" x="223.5" y="102" text-anchor="end">72.8%</text>
  </g>
  <g class="t">
    <circle cx="30" cy="134" r="5" fill="#6D7CF5"/>
    <text class="l" x="44" y="138">Python</text>
    <text class="s" x="223.5" y="138" text-anchor="end">12.9%</text>
  </g>
  <g class="t">
    <circle cx="30" cy="170" r="5" fill="#3B82F6"/>
    <text class="l" x="44" y="174">HTML</text>
    <text class="s" x="223.5" y="174" text-anchor="end">10.7%</text>
  </g>
  <g class="t">
    <circle cx="253.5" cy="98" r="5" fill="#38BDF8"/>
    <text class="l" x="267.5" y="102">CSS</text>
    <text class="s" x="447" y="102" text-anchor="end">1.9%</text>
  </g>
  <g class="t">
    <circle cx="253.5" cy="134" r="5" fill="#A78BFA"/>
    <text class="l" x="267.5" y="138">JavaScript</text>
    <text class="s" x="447" y="138" text-anchor="end">1.5%</text>
  </g>
  <g class="t">
    <circle cx="253.5" cy="170" r="5" fill="#64748B"/>
    <text class="l" x="267.5" y="174">PLpgSQL</text>
    <text class="s" x="447" y="174" text-anchor="end">0.1%</text>
  </g>
  <text class="t s" x="24" y="212">By code size across public repositories</text>
</svg>
