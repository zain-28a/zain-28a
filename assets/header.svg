<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Zain Alloush, Software Developer</title>
  <desc id="desc">Dark banner with a slowly shifting purple and electric-blue glow.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="22"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.35" stop-color="#C4B5FD"/>
      <stop offset="0.65" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#3B82F6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 600 0; 0 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#272738" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    .glow { animation: drift 16s ease-in-out infinite alternate; }
    .glow.b { animation-duration: 19s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translate(-60px, 10px); } to { transform: translate(80px, -20px); } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0B0B12"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="glow" cx="300" cy="120" r="170" fill="#8B5CF6"/>
      <circle class="glow b" cx="900" cy="190" r="170" fill="#3B82F6"/>
    </g>
    <rect width="1200" height="300" fill="url(#dots)" opacity="0.05"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="21.5" fill="none" stroke="url(#edge)"/>
  <text x="600" y="158" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="8" fill="url(#name)">ZAIN ALLOUSH</text>
  <rect x="510" y="186" width="180" height="2" rx="1" fill="url(#rule)"/>
  <text x="600" y="226" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="9" fill="#9A9AB0">SOFTWARE DEVELOPER</text>
</svg>
