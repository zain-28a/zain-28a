<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Zain Alloush, Software Developer</title>
  <desc id="desc">A frosted glass panel with the name Zain Alloush over two slowly drifting shapes.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="22"/></clipPath>
    <clipPath id="panel"><rect x="220" y="62" width="760" height="176" rx="26"/></clipPath>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <g id="shapes">
      <circle cx="292" cy="96" r="74" fill="#8B5CF6">
        <animateTransform attributeName="transform" type="translate" values="0 0; 56 22; 0 0" dur="24s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      </circle>
      <circle cx="916" cy="212" r="62" fill="#3B82F6">
        <animateTransform attributeName="transform" type="translate" values="0 0; -52 -18; 0 0" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      </circle>
    </g>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0B0C10"/>
    <use href="#shapes" opacity="0.8"/>
    <g clip-path="url(#panel)">
      <rect x="220" y="62" width="760" height="176" fill="#0B0C10"/>
      <use href="#shapes" filter="url(#frost)" opacity="0.6"/>
    </g>
  </g>
  <rect x="220.75" y="62.75" width="758.5" height="174.5" rx="25.25" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <path d="M246 63.6 H954" stroke="#FFFFFF" stroke-opacity="0.22" stroke-linecap="round"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="7" fill="#F2F2F5">ZAIN ALLOUSH</text>
  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#F2F2F5" fill-opacity="0.68">SOFTWARE DEVELOPER</text>
</svg>
