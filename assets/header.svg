  <text x="86" y="164" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="#F5F5F5" fill-opacity="0.68">SOFTWARE DEVELOPER</text>
</svg>
