# Rebuilds the statistics cards in assets/stats/ from public GitHub data
# and commits them when they change. No third-party service is involved.
name: Profile stats

on:
  schedule:
    - cron: "41 3 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/stats.yml
      - scripts/generate-stats.mjs

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the cards
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git add assets/stats
          if git diff --cached --quiet; then
            echo "Stats unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile stats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
